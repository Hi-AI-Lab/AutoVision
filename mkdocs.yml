# AutoVision 公开文档站点配置。
#
# 契约（由 CI 与 tests/test_infrastructure.py 强制）：
#   - 导航引用的每个路径必须存在于 docs/ 下；
#   - `mkdocs build --strict` 零警告（站内链接、导航、孤儿页面均受检）；
#   - docs/ 下的页面必须全部出现在导航里，或经 exclude_docs 显式排除；
#   - 公开树相对链接由 scripts/check_docs_links.py 独立检查（覆盖仓库根
#     Markdown，超出本站点范围）。
site_name: AutoVision
site_description: 企业级视觉模型训练框架：预训练/蒸馏 → 微调 → 评测 → 导出

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  # 站点页包含仓库根 CONTRIBUTING.md / CHANGELOG.md（单一来源，避免漂移）。
  - pymdownx.snippets:
      base_path: ["."]

nav:
  - 首页: index.md
  - 模型库: model_zoo.md
  - 权重下载: download_weights.md
  - 基准: benchmarks.md
  - 导出与部署: export.md
  - 插件协议: plugins.md
  - 私有注册表: registry.md
  - 合规报告: compliance.md
  - 溯源台账: provenance/LEDGER.md
  - 硬件伙伴包: hardware_packs.md
  - 用户自持权重: user_held_weights.md
  - 导入 EoMT 权重: import_eomt.md
  - 已知限制: known_limits.md
  - 架构总览: framework_design.md
  - 贡献指南: contributing.md
  - 发布流程: release_process.md
  - PyPI 发布: pypi_publish.md
  - 模型发布: model_publish.md
  - LTS 政策: lts_policy.md
  - 支持政策: support_policy.md
  - 变更日志: changelog.md

# 内部分析稿（决策依据，非对外发布产物）不进入站点；
# 对应文档自带的「非对外发布产物」状态即此处置的依据。
exclude_docs: |
  strategy/gap-analysis.md
  strategy/roadmap_90d_design.md
