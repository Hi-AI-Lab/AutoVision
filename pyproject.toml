[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autovision"
version = "0.1.0"
description = "VTrain: enterprise visual model training framework (pretrain/distill -> finetune -> evaluate -> export)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "filelock>=3.0",
    "numpy>=1.23",
    "pyarrow>=15.0.0",
    "pycocotools>=2.0.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.0",
    "typer>=0.12",
]

[project.scripts]
autovision-cli = "autovision._cli:cli_entrypoint"

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.10"]
mlflow = ["mlflow>=2.8"]
wandb = ["wandb>=0.17"]
bitsandbytes = ["bitsandbytes>=0.43"]
timm = ["timm>=1.0.3"]
# Floor 3.6.1: earlier releases pin pycocotools==2.0.6, which conflicts
# with the core pycocotools requirement. super-gradients itself pins
# onnxruntime==1.15.0 upstream, so this extra can never co-install with
# the `export` extra — declared as an extra conflict in [tool.uv].
super-gradients = ["super-gradients>=3.6.1"]
# AGPL-3.0: extras-only by policy — never a core dependency, never imported
# at module level (see src/autovision/_models/ultralytics/).
ultralytics = ["ultralytics>=8.1.0"]
# DINOv2/DINOv3 and RF-DETR backbones via HuggingFace transformers (per
# framework policy: prefer transformers over third-party/vendored model
# code; see src/autovision/_models/rfdetr/). Both extras share one floor:
# the RfDetr classes ship in recent transformers releases (mid-2026), and
# the RF-DETR package gates on class presence at runtime, so a single
# floor keeps every extra's promise true regardless of which is installed.
transformers = ["transformers>=4.56"]
rfdetr = ["transformers>=4.56"]
# ONNX export pipeline (torch.export -> dynamo/legacy ONNX -> FP16 ->
# onnxslim -> verification gates); also required by the deployment tests.
export = ["onnx>=1.15", "onnxruntime>=1.17", "onnxslim>=0.1"]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "ruff>=0.8"]

[tool.uv]
# super-gradients upstream pins onnxruntime==1.15.0, which can never
# co-install with the `export` extra's onnxruntime>=1.17. Declare the
# mutual exclusion so `uv lock` can resolve both branches honestly
# (pip fails loudly if a user installs both extras together).
conflicts = [
    [
        { extra = "export" },
        { extra = "super-gradients" },
    ],
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["src/autovision.egg-info"]

[tool.ruff.lint]
# High-signal core: pycodestyle errors (E4/E7/E9), pyflakes (F), and
# import sorting (I). Broader opinionated sets (UP/BLE/PLR/RUF) are a
# deliberate follow-up — see docs/design/12-gap-implementation-status.md.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export the public surface.
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["autovision"]
