name: ci

on:
  push:
    branches: [main]
    # Release tags: the test job's release-tag check asserts the tag matches
    # the package version (tests/test_infrastructure.py::TestRelease).
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      # scripts/ is linted too: the release gates live there.
      - run: ruff check src tests scripts

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Banned-marker scan over src/tests/scripts (design doc 28 §7.2).
      # Time-boxed exemptions live in provenance_allowlist.txt; a stale
      # entry (matching no file) also fails the run.
      - run: python scripts/check_provenance.py
      # One-way layering contract (design doc 28 §4.2, rule R4).
      - run: python scripts/check_layering.py

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the docs toolchain
        run: pip install "mkdocs-material>=9.5"
      # Public-tree references (relative links + backticked repo paths).
      - run: python scripts/check_docs_links.py
      # Zero-warning site build (navigation, in-site links, orphans).
      - run: mkdocs build --strict

  test:
    runs-on: ubuntu-latest
    env:
      # Compliance: telemetry stays off in CI.
      AUTOVISION_TELEMETRY: "0"
      # Exercise the torchrun multi-process DDP suite (gloo, CPU-only).
      AUTOVISION_DDP_TESTS: "1"
      AUTOVISION_HF_TESTS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-tag check needs the tag that
          # triggered a tag-push run.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev and export extras
        run: pip install -e ".[dev,export]"
      - name: Run test suite
        run: pytest tests -q
